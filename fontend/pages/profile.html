<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <div class="page-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="form-page">
        <div class="form-page-header">
            <a href="../index.html" class="back-link">← Back to dashboard</a>
            <h1>Add profile</h1>
            <p class="page-desc">Complete your profile to personalize your experience</p>
        </div>

        <div class="card profile-container">
            <form id="add-form">
                <div class="form-section">
                    <div class="section-label">Profile image</div>
                    <div class="image-upload-area">
                        <img src="" id="imagepreview" alt="Profile preview">
                        <div class="field image-field">
                            <input type="file" name="file" id="imageinput" accept="image/*">
                        </div>
                    </div>
                </div>

                <div class="form-divider"></div>

                <div class="form-section">
                    <div class="section-label">Personal details</div>
                    <p id="msg" class="msg"></p>
                    <div class="field">
                        <label for="fullname">Full name</label>
                        <input type="text" name="fullname" id="fullname" placeholder="Enter full name">
                    </div>
                    <div class="field">
                        <label for="phone">Phone</label>
                        <input type="number" name="phone" id="phone" placeholder="Enter phone number">
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="Enter email">
                    </div>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/profile.js"></script>
</body>
</html>
